name: 🛡️ CI — Tests & Qualité

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install ruff
      - name: Ruff — style et erreurs
        run: ruff check . --output-format=github
      - name: Ruff — formatage
        run: ruff format --check .

  test:
    name: 🧪 Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - name: Pytest avec couverture
        run: pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-fail-under=70
      - name: Upload couverture vers Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml

  security:
    name: 🔒 Audit sécurité dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: Audit CVE des dépendances
        run: pip-audit -r requirements.txt --format=markdown

  demo-smoke:
    name: 🎬 Smoke test — modes démo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Tester les modes démo
        run: |
          python3 jour-01-password-vault/password_vault.py demo
          python3 jour-02-exif-cleaner/exif_cleaner.py demo
          python3 jour-03-leak-detector/leak_detector.py demo
          python3 jour-04-file-vault/file_vault.py demo
          python3 jour-10-port-scanner/port_scanner.py demo
          python3 jour-07-honeypot/honeypot.py demo
          python3 jour-09-log-anonymizer/log_anonymizer.py demo
          python3 jour-12-treatment-registry/registre_traitements.py demo
          python3 jour-29-threat-intel/threat_intel.py demo
          echo "Modes démo testés OK"
